position: Consumer
description: >-
  Lunar.dev is an enterprise-grade gateway platform for AI governance and third-party API consumption control. It
  unifies an MCP Gateway, AI Gateway, and API Consumption Gateway into a single control point that gives organizations
  observability, access control, policy enforcement, quota management, rate limiting, and real-time monitoring over how
  applications and AI agents authenticate, discover tools, and consume third-party APIs.
