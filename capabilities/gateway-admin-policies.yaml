naftiko: 1.0.0-alpha2
info:
  label: Lunar.dev Gateway Admin API — Policies
  description: 'Lunar.dev Gateway Admin API — Policies. 2 operations. Lead operation: Lunar.dev Apply policies. Self-contained
    Naftiko capability covering one Lunar Dev business surface.'
  tags:
  - Lunar Dev
  - Policies
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LUNAR_DEV_API_KEY: LUNAR_DEV_API_KEY
capability:
  consumes:
  - type: http
    namespace: gateway-admin-policies
    baseUri: http://localhost:8040
    description: Lunar.dev Gateway Admin API — Policies business capability. Self-contained, no shared references.
    resources:
    - name: apply_policies
      path: /apply_policies
      operations:
      - name: applypolicies
        method: POST
        description: Lunar.dev Apply policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: validate_policies
      path: /validate_policies
      operations:
      - name: validatepolicies
        method: POST
        description: Lunar.dev Validate policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    namespace: gateway-admin-policies-rest
    port: 8080
    description: REST adapter for Lunar.dev Gateway Admin API — Policies. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/apply-policies
      name: apply-policies
      description: REST surface for apply_policies.
      operations:
      - method: POST
        name: applypolicies
        description: Lunar.dev Apply policies
        call: gateway-admin-policies.applypolicies
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/validate-policies
      name: validate-policies
      description: REST surface for validate_policies.
      operations:
      - method: POST
        name: validatepolicies
        description: Lunar.dev Validate policies
        call: gateway-admin-policies.validatepolicies
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: gateway-admin-policies-mcp
    port: 9090
    transport: http
    description: MCP adapter for Lunar.dev Gateway Admin API — Policies. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: lunar-dev-apply-policies
      description: Lunar.dev Apply policies
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: gateway-admin-policies.applypolicies
      outputParameters:
      - type: object
        mapping: $.
    - name: lunar-dev-validate-policies
      description: Lunar.dev Validate policies
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: gateway-admin-policies.validatepolicies
      outputParameters:
      - type: object
        mapping: $.
