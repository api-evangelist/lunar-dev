naftiko: 1.0.0-alpha2
info:
  label: Lunar.dev Gateway Admin API
  description: The Lunar.dev Gateway Admin API provides administrative endpoints for managing and monitoring the Lunar API
    Consumption Gateway. The gateway acts as an egress proxy for third-party API traffic, providing visibility, control, and
    performance optimization. The admin API enables health monitoring, endpoint discovery, flow validation, and policy management
    for the running gateway instance.
  tags:
  - Lunar
  - Dev
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: lunar-dev
    baseUri: http://localhost:8040
    description: Lunar.dev Gateway Admin API HTTP API.
    resources:
    - name: healthcheck
      path: /healthcheck
      operations:
      - name: gethealthcheck
        method: GET
        description: Lunar.dev Check gateway health
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: discover
      path: /discover
      operations:
      - name: getdiscover
        method: GET
        description: Lunar.dev Discover API endpoints
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: apply-policies
      path: /apply_policies
      operations:
      - name: applypolicies
        method: POST
        description: Lunar.dev Apply policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: validate-policies
      path: /validate_policies
      operations:
      - name: validatepolicies
        method: POST
        description: Lunar.dev Validate policies
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: validate-flows
      path: /validate_flows
      operations:
      - name: validateflows
        method: POST
        description: Lunar.dev Validate flows
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: apply-flows
      path: /apply_flows
      operations:
      - name: applyflows
        method: POST
        description: Lunar.dev Apply flows
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: lunar-dev-rest
    description: REST adapter for Lunar.dev Gateway Admin API.
    resources:
    - path: /healthcheck
      name: gethealthcheck
      operations:
      - method: GET
        name: gethealthcheck
        description: Lunar.dev Check gateway health
        call: lunar-dev.gethealthcheck
        outputParameters:
        - type: object
          mapping: $.
    - path: /discover
      name: getdiscover
      operations:
      - method: GET
        name: getdiscover
        description: Lunar.dev Discover API endpoints
        call: lunar-dev.getdiscover
        outputParameters:
        - type: object
          mapping: $.
    - path: /apply_policies
      name: applypolicies
      operations:
      - method: POST
        name: applypolicies
        description: Lunar.dev Apply policies
        call: lunar-dev.applypolicies
        outputParameters:
        - type: object
          mapping: $.
    - path: /validate_policies
      name: validatepolicies
      operations:
      - method: POST
        name: validatepolicies
        description: Lunar.dev Validate policies
        call: lunar-dev.validatepolicies
        outputParameters:
        - type: object
          mapping: $.
    - path: /validate_flows
      name: validateflows
      operations:
      - method: POST
        name: validateflows
        description: Lunar.dev Validate flows
        call: lunar-dev.validateflows
        outputParameters:
        - type: object
          mapping: $.
    - path: /apply_flows
      name: applyflows
      operations:
      - method: POST
        name: applyflows
        description: Lunar.dev Apply flows
        call: lunar-dev.applyflows
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: lunar-dev-mcp
    transport: http
    description: MCP adapter for Lunar.dev Gateway Admin API for AI agent use.
    tools:
    - name: gethealthcheck
      description: Lunar.dev Check gateway health
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: lunar-dev.gethealthcheck
      outputParameters:
      - type: object
        mapping: $.
