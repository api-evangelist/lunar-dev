      call: lunar-dev.applypolicies
      outputParameters:
      - type: object
        mapping: $.
    - name: validatepolicies
      description: Lunar.dev Validate policies
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: lunar-dev.validatepolicies
      outputParameters:
      - type: object
        mapping: $.
    - name: validateflows
      description: Lunar.dev Validate flows
      hints:
        readOnly: false
